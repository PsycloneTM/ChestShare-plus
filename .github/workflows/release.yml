name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, no leading v (e.g. 1.0.1)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        env:
          VERSION: ${{ inputs.version }}
        run: ./gradlew build -Pmod_version="$VERSION"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "v$VERSION" \
            $(ls build/libs/*.jar | grep -v -e '-sources.jar' -e '-dev.jar') \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes $FLAGS
