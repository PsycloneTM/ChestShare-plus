# Minecraft / mapping / loader versions
# Check https://fabricmc.net/develop/ and each compat mod's required MC version
# and make sure they all line up before building.
minecraft_version=1.21.1
# Using official Mojang mappings (set in build.gradle) — matches the mapping set
# your compat mods are actually built against, so method names on their classes
# resolve correctly instead of needing Yarn intermediary translation.
loader_version=0.16.9

# Fabric API version - must match minecraft_version above (get exact string from
# https://modrinth.com/mod/fabric-api/versions?g=1.21.1)
fabric_version=0.116.14+1.21.1

# Cobblemon version - must match your server/client Cobblemon build exactly
# (get exact string from https://modrinth.com/mod/cobblemon/versions)
cobblemon_version=1.7.3

# Sophisticated Storage / Sophisticated Core versions — using local jars
sophisticated_storage_version=local
sophisticated_core_version=local

# Cobblefurnies version — using local jar
cobblefurnies_version=local

# Mod Properties
mod_version=0.3.0
maven_group=dev.chestshare
archives_base_name=chestshare-plus

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true